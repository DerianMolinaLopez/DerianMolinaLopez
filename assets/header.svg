<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Derian Molina Lopez — Desarrollador Frontend y Backend">
  <defs>
    <radialGradient id="glowA" cx="85%" cy="10%" r="60%">
      <stop offset="0" stop-color="#08EDFB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#08EDFB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="5%" cy="100%" r="55%">
      <stop offset="0" stop-color="#08EDFB" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#08EDFB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08EDFB"/>
      <stop offset="1" stop-color="#08EDFB" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#08EDFB" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#011F2D"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>

    <!-- terminal card -->
    <g transform="translate(790 78)" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <rect width="340" height="164" rx="14" fill="#022B3D" stroke="#08EDFB" stroke-opacity="0.25"/>
      <circle cx="22" cy="22" r="5" fill="#08EDFB" fill-opacity="0.9"/>
      <circle cx="40" cy="22" r="5" fill="#08EDFB" fill-opacity="0.45"/>
      <circle cx="58" cy="22" r="5" fill="#08EDFB" fill-opacity="0.2"/>
      <text x="22" y="64" fill="#9CA3AF">const <tspan fill="#FFFFFF">stack</tspan> = {</text>
      <text x="42" y="88" fill="#08EDFB">backend<tspan fill="#9CA3AF">: </tspan><tspan fill="#FFFFFF">"Java · Spring Boot"</tspan></text>
      <text x="42" y="112" fill="#08EDFB">frontend<tspan fill="#9CA3AF">: </tspan><tspan fill="#FFFFFF">"React · TypeScript"</tspan></text>
      <text x="42" y="136" fill="#08EDFB">cloud<tspan fill="#9CA3AF">: </tspan><tspan fill="#FFFFFF">"Google Cloud"</tspan></text>
      <text x="22" y="156" fill="#9CA3AF">}</text>
    </g>

    <!-- name -->
    <g font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">
      <text x="70" y="134" font-size="68" fill="#FFFFFF">Derian</text>
      <text x="70" y="204" font-size="68" fill="#08EDFB">Molina Lopez</text>
    </g>
    <rect x="72" y="226" width="220" height="3" rx="1.5" fill="url(#line)"/>
    <text x="70" y="264" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#FFFFFF">
      <tspan fill="#08EDFB">&gt; </tspan>Desarrollador Frontend y Backend<tspan fill="#08EDFB">_</tspan>
    </text>
  </g>
</svg>
